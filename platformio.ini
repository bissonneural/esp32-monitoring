; GPW Radar monitor — M5Stack Cardputer ADV (ESP32-S3)
; PRD: tasks/prd-cardputer-gpw-monitor.md

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino

; Cardputer ADV: 8 MB flash, 8 MB PSRAM (ESP32-S3FN8 / Stamp-S3A).
board_build.flash_mode = qio
; This table is for standalone installs. A normal upload replaces the Launcher
; layout; for the installed device, see docs/cardputer-installation.md.
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
	m5stack/M5Cardputer@^1.1.1
	bblanchon/ArduinoJson@^7.4.3

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=1
	; Route Serial to the native USB-CDC port (the ESP32-S3 has no USB-UART chip).
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	; ArduinoJson 7: no fixed-capacity documents, JsonDocument grows on the heap.
	-DARDUINOJSON_ENABLE_STD_STRING=1
